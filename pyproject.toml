[project]
name = "profilerai-x"
version = "0.1.0"
description = "From-scratch hybrid retrieval layer for ProfilerAI v2"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "numpy>=1.26",
    "sentence-transformers>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]